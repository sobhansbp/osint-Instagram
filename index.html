<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>اندرزگو · سامانه اطلاعاتی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060a10; --bg2: #0a0f17; --surface: #0e141d; --card: #111824; --card2: #16202e;
    --border: #1e2937; --border2: #2a3847;
    --gold: #c9a227; --gold2: #e3bd4d; --goldGlow: #f0d175;
    --cyan: #1e9e8a; --cyan2: #2dd4bf; --cyanGlow: #5eead4;
    --green: #2a9d82; --green2: #3dd6b0; --red: #d64545; --red2: #f07171;
    --yellow: #d6a52a; --yellow2: #f0c052; --blue: #3b7dd6; --blue2: #5b9df0;
    --purple: #8b5cf6; --purple2: #a78bfa;
    --text: #dce5f0; --text2: #8da0b8; --text3: #4d5d72;
    --crimson: #8b2332; --crimson2: #b83344;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Vazirmatn', sans-serif; min-height: 100vh; overflow-x: hidden;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* —— cyber grid + scanline atmosphere —— */
  .bg-fx { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .bg-grid {
    position: absolute; inset: -2px;
    background-image:
      linear-gradient(rgba(45,212,191,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(45,212,191,0.035) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 30%, transparent 75%);
  }
  .bg-glow1 { position: absolute; top: -15%; left: 50%; transform: translateX(-50%); width: 700px; height: 420px; background: radial-gradient(ellipse, rgba(201,162,39,0.10), transparent 70%); filter: blur(20px); }
  .bg-glow2 { position: absolute; bottom: -10%; right: -5%; width: 480px; height: 480px; background: radial-gradient(circle, rgba(30,158,138,0.08), transparent 70%); filter: blur(20px); }
  .bg-scan { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.12) 3px, rgba(0,0,0,0) 4px); opacity: 0.4; }
  body::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: 0.02; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }

  /* —— LOGIN —— */
  .login-screen { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-box { width: 100%; max-width: 390px; text-align: center; position: relative; z-index: 2; animation: fadeUp 0.7s cubic-bezier(0.16,1,0.3,1); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  .crest { width: 104px; height: 104px; margin: 0 auto 22px; position: relative; display: flex; align-items: center; justify-content: center; }
  .crest svg { width: 100%; height: 100%; filter: drop-shadow(0 4px 20px rgba(201,162,39,0.35)); position: relative; z-index: 2; }
  .crest::after { content: ''; position: absolute; inset: -10px; border-radius: 50%; background: radial-gradient(circle, rgba(201,162,39,0.18), transparent 70%); animation: pulse 3s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
  .org-name { font-size: 14px; font-weight: 800; letter-spacing: 5px; color: var(--gold2); margin-bottom: 5px; }
  .org-sub { font-size: 9px; letter-spacing: 7px; color: var(--text3); text-transform: uppercase; margin-bottom: 34px; }
  .login-card { background: linear-gradient(180deg, rgba(17,24,36,0.9), rgba(14,20,29,0.9)); border: 1px solid var(--border2); border-radius: 18px; padding: 26px 22px; backdrop-filter: blur(12px); box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .login-title { font-size: 19px; font-weight: 700; margin-bottom: 5px; }
  .login-desc { font-size: 12px; color: var(--text3); margin-bottom: 22px; }
  .login-input { width: 100%; background: var(--bg2); border: 1px solid var(--border2); border-radius: 12px; color: var(--text); padding: 15px 18px; font-size: 16px; font-family: 'JetBrains Mono', monospace; text-align: center; letter-spacing: 3px; outline: none; transition: all 0.25s; text-transform: uppercase; }
  .login-input:focus { border-color: var(--cyan2); box-shadow: 0 0 0 3px rgba(45,212,191,0.12); }
  .login-input::placeholder { letter-spacing: 1px; text-transform: none; color: var(--text3); }
  .login-btn { width: 100%; margin-top: 14px; background: linear-gradient(135deg, var(--gold), var(--gold2)); color: #060a10; border: none; border-radius: 12px; padding: 15px; font-size: 15px; font-weight: 800; font-family: 'Vazirmatn'; cursor: pointer; transition: all 0.25s; letter-spacing: 1px; }
  .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(201,162,39,0.35); }
  .login-btn:active { transform: translateY(0); }
  .login-err { color: var(--red2); font-size: 12px; margin-top: 14px; min-height: 16px; }
  .login-foot { font-size: 9px; color: var(--text3); margin-top: 20px; letter-spacing: 2px; }
  .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--cyan2); margin-left: 5px; box-shadow: 0 0 8px var(--cyan2); animation: blink 2s infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* —— APP —— */
  .app { display: none; position: relative; z-index: 2; max-width: 1000px; margin: 0 auto; padding: 16px; padding-bottom: 90px; }
  .app.active { display: block; animation: fadeUp 0.5s ease; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 1px solid var(--border); border-radius: 16px; margin-bottom: 16px; background: linear-gradient(180deg, rgba(17,24,36,0.7), rgba(14,20,29,0.5)); backdrop-filter: blur(8px); }
  .topbar-crest { width: 36px; height: 36px; flex-shrink: 0; }
  .topbar-crest svg { width: 100%; height: 100%; }
  .topbar-titles { flex: 1; min-width: 0; }
  .topbar-org { font-size: 11px; font-weight: 800; letter-spacing: 2px; color: var(--gold2); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .topbar-app { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .user-chip { font-size: 9px; color: var(--cyanGlow); background: rgba(30,158,138,0.12); border: 1px solid rgba(45,212,191,0.25); padding: 3px 10px; border-radius: 20px; letter-spacing: 1px; }
  .user-chip.admin { color: var(--gold2); background: rgba(201,162,39,0.12); border-color: rgba(201,162,39,0.3); }
  .logout-btn { background: var(--surface); border: 1px solid var(--border2); color: var(--text2); border-radius: 10px; padding: 8px 14px; font-size: 12px; font-family: 'Vazirmatn'; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .logout-btn:hover { border-color: var(--crimson2); color: var(--red2); }

  .tabs { display: flex; gap: 4px; background: rgba(14,20,29,0.6); padding: 5px; border-radius: 14px; border: 1px solid var(--border); margin-bottom: 18px; overflow-x: auto; backdrop-filter: blur(8px); }
  .tab { flex: 1; min-width: 72px; text-align: center; padding: 11px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--text3); border: none; background: transparent; font-family: 'Vazirmatn'; transition: all 0.25s; white-space: nowrap; }
  .tab:hover { color: var(--text2); }
  .tab.active { background: linear-gradient(135deg, var(--cyan), var(--cyan2)); color: #060a10; box-shadow: 0 2px 14px rgba(45,212,191,0.3); }
  .tab.admin-tab.active { background: linear-gradient(135deg, var(--gold), var(--gold2)); color: #060a10; }

  .panel { display: none; }
  .panel.active { display: block; animation: fadeUp 0.4s ease; }

  .card { background: linear-gradient(180deg, rgba(17,24,36,0.7), rgba(14,20,29,0.55)); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 14px; backdrop-filter: blur(8px); }
  .card-title { font-size: 11px; color: var(--text3); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 13px; display: flex; align-items: center; gap: 8px; }
  .card-title .ico { font-size: 15px; }
  .card-title .line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--border2), transparent); }

  input[type=text], input[type=password], textarea, select { width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: 11px; color: var(--text); padding: 12px 15px; font-size: 13px; font-family: 'JetBrains Mono', monospace; outline: none; transition: border-color 0.2s; direction: ltr; }
  input:focus, textarea:focus, select:focus { border-color: var(--cyan2); }
  textarea { resize: vertical; min-height: 90px; line-height: 1.7; }
  select { cursor: pointer; font-family: 'Vazirmatn'; direction: rtl; }
  .hint { font-size: 11px; color: var(--text3); margin-top: 7px; line-height: 1.8; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 20px; border-radius: 12px; font-size: 14px; font-weight: 700; font-family: 'Vazirmatn'; cursor: pointer; border: none; transition: all 0.22s; }
  .btn-primary { background: linear-gradient(135deg, var(--cyan), var(--cyan2)); color: #060a10; width: 100%; box-shadow: 0 4px 16px rgba(45,212,191,0.22); }
  .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(45,212,191,0.32); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold2)); color: #060a10; width: 100%; }
  .btn-gold:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(201,162,39,0.3); }
  .btn-sm { background: var(--surface); border: 1px solid var(--border2); color: var(--text2); font-size: 12px; padding: 9px 14px; }
  .btn-sm:hover { border-color: var(--cyan2); color: var(--cyanGlow); }
  .btn-danger { background: rgba(139,35,50,0.15); border: 1px solid var(--crimson); color: var(--red2); font-size: 12px; padding: 9px 14px; }
  .btn-danger:hover { background: rgba(139,35,50,0.25); }

  .sbox { border-radius: 12px; padding: 11px 15px; font-size: 12px; margin-top: 9px; line-height: 1.7; }
  .sbox-ok { background: rgba(42,157,130,0.12); border: 1px solid rgba(42,157,130,0.3); color: var(--green2); }
  .sbox-err { background: rgba(139,35,50,0.13); border: 1px solid rgba(139,35,50,0.35); color: var(--red2); }
  .sbox-warn { background: rgba(214,165,42,0.12); border: 1px solid rgba(214,165,42,0.3); color: var(--yellow2); }
  .sbox-load { background: rgba(45,212,191,0.1); border: 1px solid rgba(45,212,191,0.28); color: var(--cyanGlow); }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid transparent; border-top-color: currentColor; border-radius: 50%; animation: spin 0.7s linear infinite; }

  .mode-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .mode-opt { flex: 1; min-width: 96px; text-align: center; padding: 13px 8px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 12px; font-weight: 600; color: var(--text2); transition: all 0.2s; }
  .mode-opt.active { border-color: var(--cyan2); background: rgba(30,158,138,0.12); color: var(--cyanGlow); }
  .mode-opt .mode-ico { font-size: 19px; display: block; margin-bottom: 5px; }

  .stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 9px; margin-bottom: 16px; }
  .stat { background: var(--card2); border: 1px solid var(--border); border-radius: 14px; padding: 14px 8px; text-align: center; position: relative; overflow: hidden; }
  .stat::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--barcolor, var(--cyan2)); }
  .stat-num { font-size: 25px; font-weight: 900; line-height: 1; margin-bottom: 4px; font-family: 'JetBrains Mono'; }
  .stat-label { font-size: 9px; color: var(--text3); letter-spacing: 1px; }

  .empty { text-align: center; padding: 36px 20px; color: var(--text3); font-size: 14px; }
  .footer { text-align: center; padding: 22px 0 8px; color: var(--text3); font-size: 9px; letter-spacing: 2px; }

  .log { background: #04070b; border: 1px solid var(--border); border-radius: 12px; padding: 12px 15px; font-size: 11px; color: var(--text3); max-height: 170px; overflow-y: auto; direction: ltr; text-align: left; font-family: 'JetBrains Mono', monospace; line-height: 1.9; margin-bottom: 16px; display: none; }
  .log.show { display: block; }
  .log-ok { color: var(--green2); } .log-err { color: var(--red2); } .log-info { color: var(--cyanGlow); } .log-gold { color: var(--gold2); }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 5px; }

  @media(max-width:540px){ .stats-row{grid-template-columns:repeat(2,1fr);} .stat-num{font-size:21px;} }

  /* shared component styles used by section scripts */
  .member-tag { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border2); border-radius: 20px; padding: 5px 11px 5px 7px; font-size: 12px; margin: 3px; direction: ltr; }
  .member-tag .remove { cursor: pointer; color: var(--text3); font-size: 15px; line-height: 1; }
  .member-tag .remove:hover { color: var(--red2); }
  .members-wrap { display: flex; flex-wrap: wrap; padding: 9px; background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; min-height: 52px; margin-bottom: 9px; }
  .user-card { background: var(--surface); border-radius: 12px; padding: 11px 13px; margin-bottom: 7px; display: flex; align-items: center; gap: 11px; border: 1px solid transparent; transition: border-color 0.2s; }
  .user-card:hover { border-color: var(--border2); }
  .user-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--card2); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; overflow: hidden; }
  .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .user-info { flex: 1; min-width: 0; }
  .user-name { font-size: 13px; font-weight: 700; direction: ltr; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-meta { font-size: 11px; color: var(--text3); margin-top: 2px; direction: ltr; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-badges { display: flex; gap: 5px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .badge { font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 20px; white-space: nowrap; }
  .badge-done { background: rgba(42,157,130,0.15); color: var(--green2); border: 1px solid rgba(42,157,130,0.3); }
  .badge-like { background: rgba(214,165,42,0.13); color: var(--yellow2); border: 1px solid rgba(214,165,42,0.3); }
  .badge-none { background: rgba(139,35,50,0.15); color: var(--red2); border: 1px solid rgba(139,35,50,0.35); }
  .badge-partial { background: rgba(214,165,42,0.13); color: var(--yellow2); border: 1px solid rgba(214,165,42,0.3); }
  .prog-wrap { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 5px; }
  .prog-bar { height: 100%; border-radius: 2px; transition: width 0.6s cubic-bezier(0.16,1,0.3,1); }
  .filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 11px; }
  .filter-pill { padding: 6px 13px; border-radius: 20px; font-size: 11px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text3); font-family: 'Vazirmatn'; transition: all 0.18s; }
  .filter-pill.fa { background: var(--cyan); color: #060a10; border-color: var(--cyan); }
  .filter-pill.fd { background: rgba(42,157,130,0.18); color: var(--green2); border-color: rgba(42,157,130,0.35); }
  .filter-pill.fp { background: rgba(214,165,42,0.15); color: var(--yellow2); border-color: rgba(214,165,42,0.35); }
  .filter-pill.fn { background: rgba(139,35,50,0.18); color: var(--red2); border-color: rgba(139,35,50,0.4); }
  .export-row { display: flex; gap: 9px; margin-bottom: 16px; flex-wrap: wrap; }
  .export-row .btn { flex: 1; }
  .post-section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
  .post-header { padding: 13px 15px; background: var(--card2); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 9px; cursor: pointer; }
  .post-url-text { font-size: 11px; color: var(--cyanGlow); direction: ltr; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: 'JetBrains Mono'; }
  .post-body { padding: 13px 15px; }
  .post-body.collapsed { display: none; }
  .chevron { transition: transform 0.25s; font-size: 11px; color: var(--text3); }
  .chevron.open { transform: rotate(180deg); }
  .limit-row { display: flex; align-items: center; gap: 11px; margin-top: 11px; }
  .limit-row label { font-size: 12px; color: var(--text2); white-space: nowrap; }
  .limit-row select { flex: 1; }
  .ai-box { background: var(--bg2); border: 1px solid var(--border2); border-radius: 12px; padding: 15px; margin-top: 12px; font-size: 13px; line-height: 2; color: var(--text); white-space: pre-wrap; }
  .ai-box h4 { color: var(--cyanGlow); font-size: 13px; margin-bottom: 8px; }
  .comment-item { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 13px; margin-bottom: 9px; }
  .comment-he { font-size: 14px; direction: rtl; text-align: right; color: var(--text); line-height: 1.8; font-weight: 500; }
  .comment-fa { font-size: 12px; color: var(--text2); margin-top: 6px; line-height: 1.7; border-top: 1px solid var(--border); padding-top: 6px; }
  .comment-tone { display: inline-block; font-size: 10px; padding: 3px 9px; border-radius: 20px; margin-top: 7px; font-weight: 700; }
  .tone-pos { background: rgba(42,157,130,0.15); color: var(--green2); }
  .tone-neg { background: rgba(139,35,50,0.15); color: var(--red2); }
  .tone-neu { background: rgba(59,125,214,0.15); color: var(--blue2); }
  .comment-actions { display: flex; gap: 7px; margin-top: 9px; }
  .mini-btn { font-size: 11px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border2); background: var(--bg2); color: var(--text2); cursor: pointer; font-family: 'Vazirmatn'; transition: all 0.18s; }
  .mini-btn:hover { border-color: var(--cyan2); color: var(--cyanGlow); }
  .mini-btn.sel { background: var(--cyan); color: #060a10; border-color: var(--cyan); }
  .persona-card { background: linear-gradient(180deg, var(--card2), var(--surface)); border: 1px solid var(--border2); border-radius: 16px; padding: 18px; margin-top: 12px; }
  .persona-sample-tag { display: inline-block; font-size: 10px; background: rgba(214,165,42,0.15); color: var(--gold2); border: 1px solid rgba(214,165,42,0.3); padding: 4px 11px; border-radius: 20px; margin-bottom: 12px; letter-spacing: 1px; }
  .persona-field { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .persona-field .k { color: var(--text3); min-width: 80px; }
  .persona-field .v { color: var(--text); flex: 1; }
  .pw-item { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 6px; }
  .pw-item .code { flex: 1; font-family: 'JetBrains Mono'; font-size: 13px; color: var(--text); letter-spacing: 1px; }
  .pw-item .role-tag { font-size: 10px; padding: 3px 9px; border-radius: 20px; background: var(--card2); color: var(--text2); }
  .pw-item .del { cursor: pointer; color: var(--text3); font-size: 16px; }
  .pw-item .del:hover { color: var(--red2); }
  .admin-report-item { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 13px; margin-bottom: 8px; }
  .admin-report-head { display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
  .sec-badge { font-size: 10px; padding: 3px 10px; border-radius: 20px; font-weight: 700; }
  .sec-content { background: rgba(45,212,191,0.13); color: var(--cyan2); }
  .sec-monitor { background: rgba(139,92,246,0.15); color: var(--purple2); }
  .sec-persona { background: rgba(214,165,42,0.13); color: var(--gold2); }
  .sec-hr { background: rgba(59,125,214,0.13); color: var(--blue2); }
</style>
</head>
<body>
<div class="bg-fx">
  <div class="bg-grid"></div>
  <div class="bg-glow1"></div>
  <div class="bg-glow2"></div>
  <div class="bg-scan"></div>
</div>

<!-- LOGIN -->
