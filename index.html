<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ANDARZGOU // INTEL_SYS v6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --black: #000;
  --bg: #020304;
  --bg1: #040608;
  --bg2: #060a0d;
  --surface: #0a0f13;
  --card: #0d1318;
  --card2: #111a20;
  --border: #0f1e26;
  --border2: #162530;
  --border3: #1d3040;

  --green: #00ff41;
  --green2: #00cc33;
  --green3: #00ff4133;
  --green4: #00ff4111;
  --amber: #ffb700;
  --amber2: #ffd060;
  --amber3: #ffb70033;
  --red: #ff2222;
  --red2: #ff4444;
  --cyan: #00d4ff;
  --cyan2: #00aacc;
  --cyan3: #00d4ff22;
  --white: #e0eaf0;
  --dim: #3a5060;
  --dimmer: #1a2830;

  --font-mono: 'Share Tech Mono', monospace;
  --font-hud: 'Orbitron', monospace;
  --font-ui: 'Vazirmatn', sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--black);}
body{font-family:var(--font-ui);color:var(--white);min-height:100vh;overflow-x:hidden;background:var(--bg);}

/* ═══════════════════════════════════════
   BOOT SCREEN
═══════════════════════════════════════ */
#boot{position:fixed;inset:0;background:#000;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;}
#boot.hidden{display:none;}
.boot-logo{font-family:var(--font-hud);font-size:clamp(18px,5vw,38px);font-weight:900;color:var(--green);letter-spacing:6px;text-shadow:0 0 30px var(--green),0 0 60px var(--green2);margin-bottom:8px;}
.boot-sub{font-family:var(--font-mono);font-size:11px;color:var(--dim);letter-spacing:4px;margin-bottom:40px;}
.boot-lines{width:100%;max-width:500px;font-family:var(--font-mono);font-size:11px;color:var(--green2);line-height:2;text-align:left;}
.boot-line{opacity:0;animation:bootLine 0.1s forwards;}
@keyframes bootLine{to{opacity:1;}}
.boot-bar-wrap{width:100%;max-width:500px;margin-top:20px;height:2px;background:var(--border2);}
.boot-bar{height:100%;background:var(--green);width:0;transition:width 0.05s linear;box-shadow:0 0 10px var(--green);}
.boot-pct{font-family:var(--font-mono);font-size:10px;color:var(--green);margin-top:8px;text-align:center;letter-spacing:2px;}

/* ═══════════════════════════════════════
   SCANLINE + NOISE OVERLAY
═══════════════════════════════════════ */
.overlay-scan{position:fixed;inset:0;pointer-events:none;z-index:999;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.08) 2px,rgba(0,0,0,0.08) 4px);animation:scanMove 8s linear infinite;}
@keyframes scanMove{0%{background-position:0 0;}100%{background-position:0 100px;}}
.overlay-vignette{position:fixed;inset:0;pointer-events:none;z-index:998;background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(0,0,0,0.7) 100%);}
.corner-tl,.corner-tr,.corner-bl,.corner-br{position:fixed;width:60px;height:60px;pointer-events:none;z-index:997;}
.corner-tl{top:12px;left:12px;border-top:1px solid var(--green);border-left:1px solid var(--green);}
.corner-tr{top:12px;right:12px;border-top:1px solid var(--green);border-right:1px solid var(--green);}
.corner-bl{bottom:12px;left:12px;border-bottom:1px solid var(--green);border-left:1px solid var(--green);}
.corner-br{bottom:12px;right:12px;border-bottom:1px solid var(--green);border-right:1px solid var(--green);}

/* ═══════════════════════════════════════
   LOGIN
═══════════════════════════════════════ */
#loginScreen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);}
.login-wrap{width:100%;max-width:400px;animation:fadeUp 0.6s cubic-bezier(0.16,1,0.3,1);}
.login-header{text-align:center;margin-bottom:32px;}
.login-emblem{width:72px;height:72px;margin:0 auto 20px;position:relative;}
.login-emblem svg{width:100%;height:100%;filter:drop-shadow(0 0 12px var(--green)) drop-shadow(0 0 30px var(--green2));}
.login-emblem::before{content:'';position:absolute;inset:-12px;border:1px solid var(--green3);animation:rotateSlow 8s linear infinite;}
.login-emblem::after{content:'';position:absolute;inset:-20px;border:1px solid var(--border3);animation:rotateSlow 12s linear infinite reverse;}
@keyframes rotateSlow{to{transform:rotate(360deg);}}
.login-callsign{font-family:var(--font-hud);font-size:16px;font-weight:900;letter-spacing:8px;color:var(--green);text-shadow:0 0 20px var(--green);}
.login-unit{font-family:var(--font-mono);font-size:9px;color:var(--dim);letter-spacing:5px;margin-top:6px;}
.login-box{background:var(--surface);border:1px solid var(--border3);padding:28px 24px;position:relative;}
.login-box::before{content:'ACCESS_TERMINAL v6.0';position:absolute;top:-1px;left:16px;font-family:var(--font-mono);font-size:9px;color:var(--green);background:var(--surface);padding:0 8px;letter-spacing:2px;}
.login-prompt{font-family:var(--font-mono);font-size:11px;color:var(--green2);margin-bottom:16px;letter-spacing:1px;}
.login-prompt::before{content:'> ';}
.login-field{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border3);color:var(--green);padding:12px 0;font-size:15px;font-family:var(--font-mono);letter-spacing:4px;text-align:left;outline:none;transition:border-color 0.2s;caret-color:var(--green);}
.login-field:focus{border-bottom-color:var(--green);}
.login-field::placeholder{color:var(--dimmer);letter-spacing:2px;font-size:12px;}
.login-submit{width:100%;margin-top:20px;background:transparent;border:1px solid var(--green);color:var(--green);padding:14px;font-family:var(--font-mono);font-size:12px;letter-spacing:4px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden;}
.login-submit::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,var(--green3),transparent);transition:left 0.4s;}
.login-submit:hover::before{left:100%;}
.login-submit:hover{background:var(--green3);box-shadow:0 0 20px var(--green3);color:var(--green2);}
.login-err{font-family:var(--font-mono);font-size:10px;color:var(--red);margin-top:12px;letter-spacing:1px;min-height:14px;}
.login-err::before{content:'[ERR] ';}
.login-status{display:flex;align-items:center;gap:8px;margin-top:20px;font-family:var(--font-mono);font-size:9px;color:var(--dim);letter-spacing:2px;}
.status-led{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:ledBlink 2s infinite;}
@keyframes ledBlink{0%,100%{opacity:1;}50%{opacity:0.3;}}

/* ═══════════════════════════════════════
   APP SHELL
═══════════════════════════════════════ */
.app{display:none;position:relative;z-index:2;max-width:1000px;margin:0 auto;padding:12px;padding-bottom:80px;}
.app.active{display:block;}

/* HUD BAR */
.hud-bar{display:flex;align-items:center;gap:0;margin-bottom:12px;background:var(--surface);border:1px solid var(--border2);position:relative;overflow:hidden;}
.hud-bar::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--green),transparent);}
.hud-section{padding:10px 14px;border-left:1px solid var(--border2);display:flex;align-items:center;gap:8px;}
.hud-section:first-child{border-left:none;}
.hud-emblem-sm{width:24px;height:24px;flex-shrink:0;}
.hud-emblem-sm svg{width:100%;height:100%;filter:drop-shadow(0 0 6px var(--amber));}
.hud-org{font-family:var(--font-hud);font-size:9px;font-weight:700;color:var(--amber);letter-spacing:3px;}
.hud-ver{font-family:var(--font-mono);font-size:8px;color:var(--dim);letter-spacing:2px;}
.hud-user{font-family:var(--font-mono);font-size:10px;color:var(--green);padding:3px 10px;border:1px solid var(--green3);background:var(--green4);letter-spacing:2px;}
.hud-user.admin{color:var(--amber);border-color:var(--amber3);background:rgba(255,183,0,0.06);}
.hud-clock{font-family:var(--font-mono);font-size:11px;color:var(--green);letter-spacing:2px;min-width:60px;}
.hud-spacer{flex:1;}
.hud-logout{background:transparent;border:1px solid var(--border3);color:var(--dim);padding:6px 14px;font-family:var(--font-mono);font-size:9px;cursor:pointer;letter-spacing:2px;transition:all 0.2s;}
.hud-logout:hover{border-color:var(--red);color:var(--red);}

/* NAV */
.nav-bar{display:flex;gap:2px;margin-bottom:12px;background:var(--surface);border:1px solid var(--border2);padding:4px;overflow-x:auto;}
.nav-tab{flex:1;min-width:60px;padding:10px 8px;font-family:var(--font-mono);font-size:10px;letter-spacing:1px;color:var(--dim);background:transparent;border:1px solid transparent;cursor:pointer;text-align:center;transition:all 0.15s;white-space:nowrap;position:relative;}
.nav-tab::after{content:'';position:absolute;bottom:0;left:50%;right:50%;height:1px;background:var(--green);transition:all 0.2s;}
.nav-tab:hover{color:var(--white);border-color:var(--border3);}
.nav-tab.active{color:var(--green);border-color:var(--border3);background:var(--bg2);}
.nav-tab.active::after{left:0;right:0;}
.nav-tab.admin-tab.active{color:var(--amber);border-color:var(--amber3);}
.nav-tab.admin-tab.active::after{background:var(--amber);}

/* PANELS */
.panel{display:none;}
.panel.active{display:block;animation:fadeUp 0.3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border2);padding:16px;margin-bottom:10px;position:relative;}
.card::before{content:'';position:absolute;top:0;left:0;width:2px;height:100%;background:var(--border3);}
.card-title{font-family:var(--font-mono);font-size:9px;color:var(--dim);letter-spacing:3px;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.card-title .ico{font-size:12px;}
.card-title::after{content:'';flex:1;height:1px;background:var(--border2);}
.card.accent-green::before{background:var(--green);}
.card.accent-amber::before{background:var(--amber);}
.card.accent-red::before{background:var(--red);}
.card.accent-cyan::before{background:var(--cyan);}

/* INPUTS */
input[type=text],input[type=password],textarea,select{width:100%;background:var(--bg2);border:none;border-bottom:1px solid var(--border3);color:var(--white);padding:11px 12px;font-size:13px;font-family:var(--font-mono);outline:none;transition:border-color 0.2s;direction:ltr;border-radius:0;}
input:focus,textarea:focus,select:focus{border-bottom-color:var(--green);}
textarea{resize:vertical;min-height:80px;line-height:1.7;}
select{cursor:pointer;font-family:var(--font-ui);direction:rtl;}
.hint{font-family:var(--font-mono);font-size:10px;color:var(--dim);margin-top:7px;line-height:1.8;letter-spacing:0.5px;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;font-family:var(--font-mono);font-size:11px;letter-spacing:2px;cursor:pointer;border:1px solid;transition:all 0.2s;background:transparent;position:relative;overflow:hidden;}
.btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.03),transparent);transition:left 0.4s;}
.btn:hover::before{left:100%;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.btn-primary{border-color:var(--green);color:var(--green);width:100%;}
.btn-primary:hover:not(:disabled){background:var(--green3);box-shadow:0 0 20px var(--green3);}
.btn-amber{border-color:var(--amber);color:var(--amber);width:100%;}
.btn-amber:hover:not(:disabled){background:var(--amber3);}
.btn-sm{border-color:var(--border3);color:var(--dim);font-size:10px;padding:8px 14px;}
.btn-sm:hover{border-color:var(--green);color:var(--green);}
.btn-danger{border-color:var(--red);color:var(--red);font-size:10px;padding:8px 14px;}
.btn-danger:hover{background:rgba(255,34,34,0.08);}

/* STATUS BOXES */
.sbox{padding:10px 14px;font-family:var(--font-mono);font-size:11px;margin-top:8px;line-height:1.7;border-left:2px solid;}
.sbox-ok{border-color:var(--green);color:var(--green2);background:var(--green4);}
.sbox-err{border-color:var(--red);color:var(--red2);background:rgba(255,34,34,0.05);}
.sbox-warn{border-color:var(--amber);color:var(--amber2);background:var(--amber3);}
.sbox-load{border-color:var(--cyan);color:var(--cyan);background:var(--cyan3);}

/* SPINNER */
@keyframes spin{to{transform:rotate(360deg);}}
.spinner{display:inline-block;width:12px;height:12px;border:1px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin 0.6s linear infinite;}

/* MODE ROW */
.mode-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.mode-opt{flex:1;min-width:80px;text-align:center;padding:12px 8px;border:1px solid var(--border3);background:transparent;cursor:pointer;font-family:var(--font-mono);font-size:10px;color:var(--dim);transition:all 0.2s;letter-spacing:1px;}
.mode-opt.active{border-color:var(--green);color:var(--green);background:var(--green4);}
.mode-opt .mode-ico{font-size:16px;display:block;margin-bottom:5px;}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.stat{background:var(--card);border:1px solid var(--border2);padding:14px 8px;text-align:center;position:relative;overflow:hidden;}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--barcolor,var(--green));}
.stat-num{font-family:var(--font-hud);font-size:22px;font-weight:700;line-height:1;margin-bottom:4px;}
.stat-label{font-family:var(--font-mono);font-size:8px;color:var(--dim);letter-spacing:2px;}

/* TABS (inner) */
.tabs{display:flex;gap:0;border:1px solid var(--border2);margin-bottom:14px;overflow-x:auto;}
.tab{flex:1;min-width:60px;text-align:center;padding:10px 8px;font-family:var(--font-mono);font-size:10px;cursor:pointer;color:var(--dim);background:transparent;border:none;border-right:1px solid var(--border2);transition:all 0.15s;white-space:nowrap;letter-spacing:1px;}
.tab:last-child{border-right:none;}
.tab.active{color:var(--green);background:var(--green4);}

/* LOG */
.log{background:#000;border:1px solid var(--border2);border-left:2px solid var(--green);padding:10px 14px;font-size:10px;color:var(--green2);max-height:160px;overflow-y:auto;direction:ltr;text-align:left;font-family:var(--font-mono);line-height:1.9;margin-bottom:12px;display:none;}
.log.show{display:block;}
.log-ok{color:var(--green);} .log-err{color:var(--red);} .log-info{color:var(--cyan);} .log-gold{color:var(--amber);}

/* SCROLLBAR */
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border3);}

/* MEMBER TAGS */
.member-tag{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--border3);padding:4px 10px;font-family:var(--font-mono);font-size:11px;margin:3px;direction:ltr;}
.member-tag .remove{cursor:pointer;color:var(--dim);}
.member-tag .remove:hover{color:var(--red);}
.members-wrap{display:flex;flex-wrap:wrap;padding:8px;background:var(--bg2);border:1px solid var(--border2);min-height:50px;margin-bottom:8px;}

/* USER CARDS */
.user-card{background:var(--card);border:1px solid var(--border2);padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px;border-left:2px solid transparent;transition:border-color 0.2s;}
.user-card:hover{border-left-color:var(--green);}
.user-avatar{width:32px;height:32px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;border:1px solid var(--border3);}
.user-info{flex:1;min-width:0;}
.user-name{font-family:var(--font-mono);font-size:12px;font-weight:700;direction:ltr;text-align:left;color:var(--white);}
.user-meta{font-family:var(--font-mono);font-size:10px;color:var(--dim);margin-top:2px;direction:ltr;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.user-badges{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
.badge{font-family:var(--font-mono);font-size:9px;font-weight:700;padding:3px 8px;letter-spacing:1px;}
.badge-done{border:1px solid var(--green3);color:var(--green);background:var(--green4);}
.badge-like{border:1px solid var(--amber3);color:var(--amber);}
.badge-none{border:1px solid rgba(255,34,34,0.3);color:var(--red2);}
.badge-partial{border:1px solid var(--amber3);color:var(--amber);}

/* PROGRESS */
.prog-wrap{height:2px;background:var(--border2);margin-top:4px;}
.prog-bar{height:100%;transition:width 0.5s ease;}

/* FILTER PILLS */
.filter-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
.filter-pill{padding:5px 12px;font-family:var(--font-mono);font-size:9px;cursor:pointer;border:1px solid var(--border3);background:transparent;color:var(--dim);letter-spacing:1px;transition:all 0.15s;}
.filter-pill.fa{border-color:var(--green);color:var(--green);background:var(--green4);}
.filter-pill.fd{border-color:var(--green3);color:var(--green2);}
.filter-pill.fp{border-color:var(--amber3);color:var(--amber);}
.filter-pill.fn{border-color:rgba(255,34,34,0.3);color:var(--red2);}

/* POST SECTIONS */
.post-section{background:var(--card);border:1px solid var(--border2);margin-bottom:8px;}
.post-header{padding:10px 14px;background:var(--card2);border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:8px;cursor:pointer;}
.post-url-text{font-family:var(--font-mono);font-size:10px;color:var(--cyan);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;}
.post-body{padding:12px 14px;}
.post-body.collapsed{display:none;}
.chevron{transition:transform 0.2s;font-size:10px;color:var(--dim);}
.chevron.open{transform:rotate(180deg);}

/* LIMIT ROW */
.limit-row{display:flex;align-items:center;gap:10px;margin-top:10px;}
.limit-row label{font-family:var(--font-mono);font-size:10px;color:var(--dim);white-space:nowrap;letter-spacing:1px;}
.limit-row select{flex:1;}

/* AI BOX */
.ai-box{background:var(--bg2);border:1px solid var(--border2);border-left:2px solid var(--green);padding:14px;margin-top:10px;font-size:13px;line-height:2;color:var(--white);white-space:pre-wrap;}
.ai-box h4{font-family:var(--font-mono);font-size:11px;letter-spacing:2px;margin-bottom:6px;}

/* COMMENT ITEMS */
.comment-item{background:var(--card);border:1px solid var(--border2);border-left:2px solid var(--border3);padding:12px;margin-bottom:8px;transition:border-left-color 0.2s;}
.comment-item.selected{border-left-color:var(--green);}
.comment-he{font-size:14px;direction:rtl;text-align:right;line-height:1.8;font-weight:500;}
.comment-fa{font-family:var(--font-mono);font-size:11px;color:var(--dim);margin-top:6px;line-height:1.7;border-top:1px solid var(--border2);padding-top:6px;}
.comment-tone{font-family:var(--font-mono);font-size:9px;padding:2px 8px;border:1px solid;margin-top:6px;display:inline-block;letter-spacing:1px;}
.tone-pos{border-color:var(--green3);color:var(--green);}
.tone-neg{border-color:rgba(255,34,34,0.3);color:var(--red2);}
.tone-neu{border-color:var(--border3);color:var(--dim);}
.comment-actions{display:flex;gap:6px;margin-top:8px;}
.mini-btn{font-family:var(--font-mono);font-size:9px;padding:5px 10px;border:1px solid var(--border3);background:transparent;color:var(--dim);cursor:pointer;letter-spacing:1px;transition:all 0.15s;}
.mini-btn:hover{border-color:var(--green);color:var(--green);}
.mini-btn.sel{border-color:var(--green);color:var(--green);background:var(--green4);}

/* PERSONA */
.persona-card{background:var(--card);border:1px solid var(--border3);border-left:2px solid var(--amber);padding:16px;margin-top:10px;}
.persona-sample-tag{font-family:var(--font-mono);font-size:9px;border:1px solid var(--amber3);color:var(--amber);padding:3px 10px;margin-bottom:12px;display:inline-block;letter-spacing:2px;}
.persona-field{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--border2);font-size:12px;}
.persona-field .k{font-family:var(--font-mono);color:var(--dim);min-width:72px;font-size:10px;letter-spacing:1px;}
.persona-field .v{color:var(--white);flex:1;}

/* ADMIN */
.pw-item{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border:1px solid var(--border2);margin-bottom:5px;}

<!-- ═══════════════════════════════════════
     افکت ۱: Signal Intercept — امواج سیگنال
═══════════════════════════════════════ -->
<canvas id="signalCanvas" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;opacity:0.08;"></canvas>
<script>
(function(){
  const c = document.getElementById('signalCanvas');
  const ctx = c.getContext('2d');
  const waves = [];
  function resize(){ c.width=window.innerWidth; c.height=window.innerHeight; }
  resize(); window.addEventListener('resize',resize);

  // چند مرکز سیگنال ثابت — مثل فرستنده‌های رادیویی
  const sources = [
    {x:0.15,y:0.3,color:'#00ff41',speed:0.8},
    {x:0.85,y:0.7,color:'#00d4ff',speed:0.6},
    {x:0.5,y:0.1,color:'#ffb700',speed:0.5},
  ];

  setInterval(()=>{
    sources.forEach(s=>{
      waves.push({x:s.x*c.width,y:s.y*c.height,r:0,max:Math.max(c.width,c.height)*0.6,color:s.color,speed:s.speed+Math.random()*0.3,alpha:0.8});
    });
  }, 1200);

  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    for(let i=waves.length-1;i>=0;i--){
      const w=waves[i];
      ctx.beginPath();
      ctx.arc(w.x,w.y,w.r,0,Math.PI*2);
      ctx.strokeStyle=w.color;
      ctx.lineWidth=0.8;
      ctx.globalAlpha=w.alpha*(1-w.r/w.max);
      ctx.stroke();
      w.r+=w.speed*2;
      w.alpha*=0.995;
      if(w.r>w.max||w.alpha<0.01) waves.splice(i,1);
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

<!-- ═══════════════════════════════════════
     افکت ۲: Target Lock — قفل هدف
═══════════════════════════════════════ -->
<canvas id="targetCanvas" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;"></canvas>
<script>
(function(){
  const c = document.getElementById('targetCanvas');
  const ctx = c.getContext('2d');
  let targets = [];
  let active = false;

  function resize(){ c.width=window.innerWidth; c.height=window.innerHeight; }
  resize(); window.addEventListener('resize',resize);

  // هر ۱۵ ثانیه یه target lock تصادفی
  function spawnTarget(){
    const margin=100;
    targets.push({
      x: margin+Math.random()*(c.width-margin*2),
      y: margin+Math.random()*(c.height-margin*2),
      r: 80, minR:20, phase:'lock', alpha:0, lockProgress:0,
      color: Math.random()>0.5?'#ff2222':'#00ff41',
      id:'TGT_'+Math.floor(Math.random()*9999).toString().padStart(4,'0'),
    });
  }

  setInterval(spawnTarget, 15000);
  setTimeout(spawnTarget, 3000);

  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    targets.forEach((t,i)=>{
      if(t.phase==='lock'){
        t.alpha=Math.min(1,t.alpha+0.04);
        t.r=Math.max(t.minR,t.r-1.2);
        t.lockProgress=Math.min(1,(80-t.r)/(80-t.minR));
        if(t.r<=t.minR) t.phase='hold';
      } else if(t.phase==='hold'){
        t.holdTime=(t.holdTime||0)+1;
        if(t.holdTime>80) t.phase='fade';
      } else {
        t.alpha=Math.max(0,t.alpha-0.03);
        if(t.alpha<=0){ targets.splice(i,1); return; }
      }

      ctx.save();
      ctx.globalAlpha=t.alpha*0.7;
      ctx.strokeStyle=t.color;
      ctx.lineWidth=1;

      // دایره اصلی
      ctx.beginPath(); ctx.arc(t.x,t.y,t.r,0,Math.PI*2); ctx.stroke();

      // خطوط cross
      const gap=t.r+8;
      ctx.beginPath(); ctx.moveTo(t.x-gap-10,t.y); ctx.lineTo(t.x-gap,t.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(t.x+gap,t.y); ctx.lineTo(t.x+gap+10,t.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(t.x,t.y-gap-10); ctx.lineTo(t.x,t.y-gap); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(t.x,t.y+gap); ctx.lineTo(t.x,t.y+gap+10); ctx.stroke();

      // corner brackets
      const b=t.r*0.6;
      [[1,1],[-1,1],[1,-1],[-1,-1]].forEach(([sx,sy])=>{
        ctx.beginPath();
        ctx.moveTo(t.x+sx*(t.r-2),t.y+sy*(t.r-2-b));
        ctx.lineTo(t.x+sx*(t.r-2),t.y+sy*(t.r-2));
        ctx.lineTo(t.x+sx*(t.r-2-b),t.y+sy*(t.r-2));
        ctx.stroke();
      });

      // progress arc
      ctx.beginPath();
      ctx.arc(t.x,t.y,t.r+6,-Math.PI/2,-Math.PI/2+Math.PI*2*t.lockProgress);
      ctx.strokeStyle=t.color; ctx.lineWidth=2; ctx.stroke();

      // label
      ctx.fillStyle=t.color;
      ctx.font='8px Share Tech Mono';
      ctx.textAlign='left';
      ctx.fillText(t.id,t.x+t.r+10,t.y-4);
      ctx.fillText(t.phase==='hold'?'LOCKED':'TRACKING',t.x+t.r+10,t.y+8);

      ctx.restore();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

<!-- ═══════════════════════════════════════
     افکت ۳: Surveillance Scan Line
═══════════════════════════════════════ -->
<canvas id="scanCanvas" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;opacity:0.15;"></canvas>
<script>
(function(){
  const c = document.getElementById('scanCanvas');
  const ctx = c.getContext('2d');
  let scanY=0;

  function resize(){ c.width=window.innerWidth; c.height=window.innerHeight; }
  resize(); window.addEventListener('resize',resize);

  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    // خط اصلی scan
    const grad=ctx.createLinearGradient(0,scanY-30,0,scanY+4);
    grad.addColorStop(0,'rgba(0,255,65,0)');
    grad.addColorStop(0.7,'rgba(0,255,65,0.15)');
    grad.addColorStop(1,'rgba(0,255,65,0.6)');
    ctx.fillStyle=grad;
    ctx.fillRect(0,scanY-30,c.width,34);

    // خط تیز
    ctx.strokeStyle='rgba(0,255,65,0.9)';
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,scanY); ctx.lineTo(c.width,scanY); ctx.stroke();

    scanY+=1.5;
    if(scanY>c.height) scanY=0;
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

<!-- ═══════════════════════════════════════
     افکت ۴: Transmission Noise — وقتی AI کار میکنه
═══════════════════════════════════════ -->
<canvas id="noiseCanvas" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:500;opacity:0;transition:opacity 0.3s;"></canvas>
<script>
window._noiseActive=false;
(function(){
  const c=document.getElementById('noiseCanvas');
  const ctx=c.getContext('2d');
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;}
  resize(); window.addEventListener('resize',resize);

  function drawNoise(){
    if(!window._noiseActive){requestAnimationFrame(drawNoise);return;}
    const img=ctx.createImageData(c.width,c.height);
    const d=img.data;
    for(let i=0;i<d.length;i+=4){
      if(Math.random()>0.97){
        const v=Math.random()>0.5?Math.floor(Math.random()*60):0;
        d[i]=0; d[i+1]=v; d[i+2]=0; d[i+3]=Math.floor(Math.random()*40);
      }
    }
    ctx.putImageData(img,0,0);
    requestAnimationFrame(drawNoise);
  }
  drawNoise();
})();

// فعال کردن noise وقتی AI کار میکنه
window.showTransmissionNoise=function(){
  window._noiseActive=true;
  document.getElementById('noiseCanvas').style.opacity='1';
};
window.hideTransmissionNoise=function(){
  window._noiseActive=false;
  document.getElementById('noiseCanvas').style.opacity='0';
  const c=document.getElementById('noiseCanvas');
  c.getContext('2d').clearRect(0,0,c.width,c.height);
};
</script>

  function randomOffset(){ return (Math.random()-0.5)*0.001; }

  function update(){
    const loc=locations[Math.floor(Math.random()*locations.length)];
    const lat=(loc.lat+randomOffset()).toFixed(4);
    const lon=(loc.lon+randomOffset()).toFixed(4);
    const alt=Math.floor(Math.random()*500+50);
    el.innerHTML=
      `TARGET: ${loc.name}<br>`+
      `LAT: ${lat}N / LON: ${lon}E<br>`+
      `ALT: ${alt}m // SIGNAL: ${Math.floor(Math.random()*40+60)}%<br>`+
      `STATUS: <span style="color:#00ff41">TRACKING</span>`;
  }
  update();
  setInterval(update,4000);
})();
</script>

<div id="decryptHud" style="position:fixed;top:60px;right:16px;pointer-events:none;z-index:997;font-family:'Share Tech Mono',monospace;font-size:8px;color:#00ff4144;line-height:1.6;text-align:right;"></div>
<script>
(function(){
  const el=document.getElementById('decryptHud');
  const chars='0123456789ABCDEF';
  let packets=0;
  let bytes=0;

  function randomHex(len){ let s=''; for(let i=0;i<len;i++) s+=chars[Math.floor(Math.random()*chars.length)]; return s; }

  function update(){
    packets+=Math.floor(Math.random()*12);
    bytes+=Math.floor(Math.random()*4096);
    const kb=(bytes/1024).toFixed(1);
    el.innerHTML=
      `SIG: ${randomHex(8)}-${randomHex(4)}<br>`+
      `PKT: ${packets.toString().padStart(6,'0')} // ${kb}KB<br>`+
      `ENC: AES-256 // RSA-4096<br>`+
      `INTERCEPT: <span style="color:#ffb700">${randomHex(6)}</span>`;
  }
  update();
  setInterval(update,1500);
})();
</script>
