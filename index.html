<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ANDARZGOU · INTEL SYS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Fira+Code:wght@300;400;500;600&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════
   DESIGN SYSTEM — Andarzgou Intel v7
   Dark Glassmorphism · Cyberpunk Modern · Responsive
═══════════════════════════════════════════════════ */
:root {
  /* Base */
  --black:   #03050a;
  --bg:      #060b14;
  --bg1:     #080e18;
  --bg2:     #0b1220;

  /* Glass surfaces */
  --glass-1: rgba(255,255,255,0.03);
  --glass-2: rgba(255,255,255,0.055);
  --glass-3: rgba(255,255,255,0.08);
  --glass-border: rgba(255,255,255,0.08);
  --glass-border-hi: rgba(255,255,255,0.14);

  /* Neon Palette */
  --cyan:    #00e5ff;
  --cyan-d:  #00b8d4;
  --cyan-gl: rgba(0,229,255,0.15);
  --cyan-glo:rgba(0,229,255,0.06);
  --amber:   #ffab00;
  --amber-d: #ff8f00;
  --amber-gl:rgba(255,171,0,0.15);
  --red:     #ff1744;
  --red-gl:  rgba(255,23,68,0.12);
  --green:   #00e676;
  --green-gl:rgba(0,230,118,0.1);
  --purple:  #d500f9;
  --purple-gl:rgba(213,0,249,0.1);

  /* Text */
  --t1: #e8f4f8;
  --t2: #7fa8bf;
  --t3: #3d6070;
  --t4: #1e3540;

  /* Fonts */
  --f-hud:  'Syne', sans-serif;
  --f-code: 'Fira Code', monospace;
  --f-ui:   'Vazirmatn', sans-serif;

  /* Spacing */
  --r: 14px;
  --r-sm: 8px;
  --r-lg: 20px;
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body {
  font-family: var(--f-ui);
  background: var(--black);
  color: var(--t1);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.5;
}

/* ── Ambient Background ── */
.ambient {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 80% 60% at 10% -10%, rgba(0,229,255,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 90% 110%, rgba(255,171,0,0.05) 0%, transparent 55%),
    radial-gradient(ellipse 40% 40% at 50% 50%, rgba(0,0,20,0.9) 0%, transparent 70%);
}
.ambient-grid {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(0,229,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,0.025) 1px, transparent 1px);
  background-size: 40px 40px;
  mask-image: radial-gradient(ellipse 100% 100% at 50% 0%, black 20%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse 100% 100% at 50% 0%, black 20%, transparent 80%);
}
/* scanline */
.scanline {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: repeating-linear-gradient(0deg,
    transparent 0px, transparent 2px,
    rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
  animation: scan 12s linear infinite;
}
@keyframes scan {
  from { background-position: 0 0; }
  to { background-position: 0 200px; }
}

/* ── BOOT ── */
#boot {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--black);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 32px 24px;
  gap: 0;
}
.boot-logo-wrap { text-align: center; margin-bottom: 36px; }
.boot-crest {
  width: 64px; height: 64px; margin: 0 auto 16px;
  position: relative;
}
.boot-crest svg { width: 100%; height: 100%; }
.boot-crest::after {
  content: '';
  position: absolute; inset: -8px;
  border: 1px solid var(--cyan);
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  animation: hexRotate 4s linear infinite;
  opacity: 0.4;
}
@keyframes hexRotate { to { transform: rotate(360deg); } }
.boot-title {
  font-family: var(--f-hud);
  font-size: clamp(20px, 5vw, 32px);
  font-weight: 800;
  letter-spacing: 8px;
  color: var(--t1);
}
.boot-title span { color: var(--cyan); }
.boot-sub {
  font-family: var(--f-code);
  font-size: 10px;
  color: var(--t3);
  letter-spacing: 4px;
  margin-top: 6px;
}
.boot-terminal {
  width: 100%; max-width: 480px;
  background: var(--glass-1);
  border: 1px solid var(--glass-border);
  border-radius: var(--r);
  padding: 18px 20px;
  backdrop-filter: blur(12px);
}
.boot-line-wrap {
  font-family: var(--f-code);
  font-size: 11px;
  line-height: 2.2;
  min-height: 100px;
}
.boot-line { opacity: 0; animation: fadeIn 0.15s forwards; }
@keyframes fadeIn { to { opacity: 1; } }
.boot-line .ok { color: var(--green); }
.boot-line .label { color: var(--t3); }
.boot-progress-wrap {
  height: 2px; background: var(--glass-border);
  border-radius: 2px; margin-top: 16px; overflow: hidden;
}
.boot-progress {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--cyan-d), var(--cyan));
  box-shadow: 0 0 10px var(--cyan);
  transition: width 0.12s ease;
}
.boot-pct {
  font-family: var(--f-code);
  font-size: 10px;
  color: var(--cyan);
  text-align: center;
  margin-top: 8px;
  letter-spacing: 2px;
}
.boot-hidden { display: none !important; }

/* ── LOGIN ── */
#loginScreen {
  position: fixed; inset: 0; z-index: 100;
  display: none;
  align-items: center; justify-content: center;
  padding: 20px;
}
.login-wrap { width: 100%; max-width: 380px; }
.login-header { text-align: center; margin-bottom: 28px; }
.login-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--glass-1);
  border: 1px solid var(--glass-border);
  border-radius: 100px;
  padding: 8px 16px;
  font-family: var(--f-hud);
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--cyan);
  margin-bottom: 24px;
  backdrop-filter: blur(8px);
}
.login-badge::before {
  content: ''; width: 6px; height: 6px;
  border-radius: 50%; background: var(--cyan);
  box-shadow: 0 0 8px var(--cyan);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.2)} }
.login-org {
  font-family: var(--f-hud);
  font-size: clamp(17px, 4.5vw, 24px);
  font-weight: 700;
  margin-bottom: 6px;
}
.login-desc {
  font-family: var(--f-code);
  font-size: 10px;
  color: var(--t3);
  letter-spacing: 2px;
}
.login-card {
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-lg);
  padding: 28px 24px;
  backdrop-filter: blur(20px);
  box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 var(--glass-border-hi);
  position: relative; overflow: hidden;
}
.login-card::before {
  content: '';
  position: absolute; top: 0; left: 20%; right: 20%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--cyan-gl), transparent);
}
.login-label {
  font-family: var(--f-code); font-size: 10px;
  color: var(--t3); letter-spacing: 2px; margin-bottom: 10px;
}
.login-input {
  width: 100%;
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-sm);
  color: var(--t1);
  padding: 14px 16px;
  font-family: var(--f-code);
  font-size: 16px;
  letter-spacing: 4px;
  text-align: center;
  outline: none;
  transition: all 0.25s;
  caret-color: var(--cyan);
}
.login-input:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px var(--cyan-glo), inset 0 0 20px rgba(0,229,255,0.03);
}
.login-input::placeholder { color: var(--t4); font-size: 13px; letter-spacing: 1px; }
.login-btn {
  width: 100%; margin-top: 14px;
  background: linear-gradient(135deg, rgba(0,229,255,0.15), rgba(0,229,255,0.05));
  border: 1px solid var(--cyan);
  border-radius: var(--r-sm);
  color: var(--cyan);
  padding: 14px;
  font-family: var(--f-hud);
  font-size: 13px; font-weight: 700;
  letter-spacing: 3px;
  cursor: pointer;
  transition: all 0.25s;
  position: relative; overflow: hidden;
}
.login-btn::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(0,229,255,0.2), transparent);
  opacity: 0; transition: opacity 0.25s;
}
.login-btn:hover::after { opacity: 1; }
.login-btn:hover { box-shadow: 0 0 24px var(--cyan-gl); }
.login-btn:active { transform: scale(0.98); }
.login-err {
  font-family: var(--f-code); font-size: 11px;
  color: var(--red); margin-top: 12px; min-height: 16px;
  text-align: center; letter-spacing: 1px; display: none;
}
.login-footer {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; margin-top: 20px;
  font-family: var(--f-code); font-size: 9px;
  color: var(--t4); letter-spacing: 2px;
}

/* ══════════════════════════════════
   APP SHELL
══════════════════════════════════ */
.app { display: none; position: relative; z-index: 2; }
.app.active { display: block; }

/* ── TOP NAV ── */
.topnav {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 0;
  background: rgba(6,11,20,0.85);
  border-bottom: 1px solid var(--glass-border);
  backdrop-filter: blur(20px);
  padding: 0 16px;
  height: 54px;
}
.topnav-brand {
  display: flex; align-items: center; gap: 10px;
  padding-left: 12px;
  border-left: 1px solid var(--glass-border);
}
.topnav-crest { width: 28px; height: 28px; flex-shrink: 0; }
.topnav-crest svg { width: 100%; height: 100%; }
.topnav-title {
  font-family: var(--f-hud); font-size: 13px; font-weight: 700;
  letter-spacing: 2px; color: var(--t1);
}
.topnav-version {
  font-family: var(--f-code); font-size: 9px;
  color: var(--t3); letter-spacing: 1px;
}
.topnav-spacer { flex: 1; }
.topnav-user {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px;
  background: var(--glass-1);
  border: 1px solid var(--glass-border);
  border-radius: 100px;
}
.topnav-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--cyan); box-shadow: 0 0 8px var(--cyan);
  animation: pulse 2s infinite;
}
.topnav-user-name {
  font-family: var(--f-code); font-size: 11px; color: var(--cyan);
}
.topnav-user.admin .topnav-dot { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
.topnav-user.admin .topnav-user-name { color: var(--amber); }
.topnav-clock {
  font-family: var(--f-code); font-size: 12px;
  color: var(--t2); letter-spacing: 1px;
  padding: 0 14px;
  border-right: 1px solid var(--glass-border);
}
.topnav-logout {
  padding: 7px 14px;
  background: transparent;
  border: 1px solid var(--glass-border);
  border-radius: var(--r-sm);
  color: var(--t3);
  font-family: var(--f-code); font-size: 10px;
  letter-spacing: 1px; cursor: pointer;
  transition: all 0.2s;
}
.topnav-logout:hover { border-color: var(--red); color: var(--red); background: var(--red-gl); }

/* ── BOTTOM TAB BAR (mobile) ── */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  display: flex; align-items: stretch;
  background: rgba(6,11,20,0.95);
  border-top: 1px solid var(--glass-border);
  backdrop-filter: blur(20px);
  height: 60px;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px;
  border: none; background: transparent;
  color: var(--t3); cursor: pointer;
  font-family: var(--f-ui); font-size: 9px;
  transition: all 0.2s; position: relative;
}
.tabbar-item::before {
  content: ''; position: absolute; top: 0; left: 20%; right: 20%; height: 1px;
  background: var(--cyan); opacity: 0; transition: opacity 0.2s;
}
.tabbar-item.active { color: var(--cyan); }
.tabbar-item.active::before { opacity: 1; }
.tabbar-item.admin-tab.active { color: var(--amber); }
.tabbar-item.admin-tab.active::before { background: var(--amber); }
.tabbar-icon { font-size: 18px; line-height: 1; }

/* ── DESKTOP SIDE NAV (≥ 768px) ── */
@media (min-width: 768px) {
  .tabbar { display: none; }
  .app-layout {
    display: grid;
    grid-template-columns: 64px 1fr;
    grid-template-rows: 54px 1fr;
    height: 100vh;
  }
  .topnav { grid-column: 1 / -1; grid-row: 1; }
  .sidenav {
    grid-column: 1; grid-row: 2;
    display: flex; flex-direction: column; align-items: center;
    padding: 16px 0; gap: 4px;
    background: rgba(6,11,20,0.7);
    border-right: 1px solid var(--glass-border);
    backdrop-filter: blur(20px);
    overflow-y: auto;
  }
  .sidenav-item {
    width: 44px; height: 44px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border: none; background: transparent;
    color: var(--t3); cursor: pointer;
    border-radius: var(--r-sm);
    font-size: 18px; transition: all 0.2s;
    position: relative;
  }
  .sidenav-item::before {
    content: ''; position: absolute;
    left: 0; top: 20%; bottom: 20%; width: 2px;
    background: var(--cyan); opacity: 0;
    border-radius: 0 2px 2px 0; transition: opacity 0.2s;
  }
  .sidenav-item:hover { background: var(--glass-1); color: var(--t2); }
  .sidenav-item.active { background: var(--cyan-glo); color: var(--cyan); }
  .sidenav-item.active::before { opacity: 1; }
  .sidenav-item.admin-tab.active { background: var(--amber-gl); color: var(--amber); }
  .sidenav-item.admin-tab.active::before { background: var(--amber); opacity: 1; }
  .sidenav-tooltip {
    position: absolute; left: 52px; top: 50%; transform: translateY(-50%);
    background: var(--bg2); border: 1px solid var(--glass-border);
    padding: 5px 10px; border-radius: var(--r-sm);
    font-family: var(--f-ui); font-size: 11px; color: var(--t2);
    white-space: nowrap; pointer-events: none;
    opacity: 0; transition: opacity 0.15s; z-index: 100;
  }
  .sidenav-item:hover .sidenav-tooltip { opacity: 1; }
  .app-main {
    grid-column: 2; grid-row: 2;
    overflow-y: auto; height: 100%;
  }
}

/* ── CONTENT WRAPPER ── */
.content {
  max-width: 860px;
  margin: 0 auto;
  padding: 20px 16px 80px;
}
@media (min-width: 768px) { .content { padding: 24px 24px 32px; } }

/* ── PANELS ── */
.panel { display: none; }
.panel.active { display: block; animation: panelIn 0.3s cubic-bezier(0.16,1,0.3,1); }
@keyframes panelIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

/* ── GLASS CARD ── */
.card {
  background: var(--glass-1);
  border: 1px solid var(--glass-border);
  border-radius: var(--r);
  padding: 18px;
  margin-bottom: 12px;
  backdrop-filter: blur(12px);
  position: relative; overflow: hidden;
  transition: border-color 0.2s;
}
.card::before {
  content: ''; position: absolute;
  top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--glass-border-hi), transparent);
}
.card:hover { border-color: var(--glass-border-hi); }
.card.glow-cyan { border-color: rgba(0,229,255,0.2); box-shadow: 0 0 30px rgba(0,229,255,0.04); }
.card.glow-amber { border-color: rgba(255,171,0,0.2); box-shadow: 0 0 30px rgba(255,171,0,0.04); }
.card.glow-red { border-color: rgba(255,23,68,0.2); box-shadow: 0 0 30px rgba(255,23,68,0.04); }
.card-title {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--f-code); font-size: 10px;
  color: var(--t3); letter-spacing: 2px;
  text-transform: uppercase; margin-bottom: 16px;
}
.card-title .ico { font-size: 14px; }
.card-title::after { content: ''; flex: 1; height: 1px; background: var(--glass-border); }

/* ── INPUTS ── */
input[type=text],input[type=password],textarea,select {
  width: 100%;
  background: rgba(0,0,0,0.2);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-sm);
  color: var(--t1);
  padding: 11px 14px;
  font-size: 13px;
  font-family: var(--f-code);
  outline: none;
  transition: all 0.2s;
  direction: ltr;
}
input:focus,textarea:focus,select:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px var(--cyan-glo);
  background: rgba(0,229,255,0.02);
}
textarea { resize: vertical; min-height: 80px; line-height: 1.7; }
select { cursor: pointer; font-family: var(--f-ui); direction: rtl; }
.hint {
  font-family: var(--f-code); font-size: 10px;
  color: var(--t3); margin-top: 6px; line-height: 1.8;
}

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; padding: 11px 18px;
  border-radius: var(--r-sm);
  font-size: 13px; font-weight: 600;
  font-family: var(--f-ui);
  cursor: pointer; border: 1px solid;
  transition: all 0.2s; position: relative; overflow: hidden;
}
.btn-primary {
  background: linear-gradient(135deg, rgba(0,229,255,0.12), rgba(0,229,255,0.04));
  border-color: var(--cyan); color: var(--cyan); width: 100%;
}
.btn-primary:hover:not(:disabled) {
  background: linear-gradient(135deg, rgba(0,229,255,0.2), rgba(0,229,255,0.08));
  box-shadow: 0 4px 20px rgba(0,229,255,0.2);
  transform: translateY(-1px);
}
.btn-amber {
  background: linear-gradient(135deg, rgba(255,171,0,0.12), rgba(255,171,0,0.04));
  border-color: var(--amber); color: var(--amber); width: 100%;
}
.btn-amber:hover:not(:disabled) {
  background: linear-gradient(135deg, rgba(255,171,0,0.2), rgba(255,171,0,0.08));
  box-shadow: 0 4px 20px rgba(255,171,0,0.18);
  transform: translateY(-1px);
}
.btn-sm {
  background: var(--glass-1); border-color: var(--glass-border);
  color: var(--t2); font-size: 12px; padding: 8px 14px;
}
.btn-sm:hover { border-color: var(--cyan-d); color: var(--cyan); background: var(--cyan-glo); }
.btn-danger {
  background: var(--red-gl); border-color: rgba(255,23,68,0.4);
  color: var(--red); font-size: 12px; padding: 8px 14px;
}
.btn-danger:hover { background: rgba(255,23,68,0.2); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn:active { transform: scale(0.98); }

/* ── STATUS BOXES ── */
.sbox {
  padding: 10px 14px; font-family: var(--f-code);
  font-size: 11px; margin-top: 8px; line-height: 1.7;
  border-radius: var(--r-sm); border-left: 2px solid;
}
.sbox-ok   { border-color:var(--green);  color:var(--green);  background:var(--green-gl); }
.sbox-err  { border-color:var(--red);    color:var(--red);    background:var(--red-gl); }
.sbox-warn { border-color:var(--amber);  color:var(--amber);  background:var(--amber-gl); }
.sbox-load { border-color:var(--cyan);   color:var(--cyan);   background:var(--cyan-glo); }

/* ── SPINNER ── */
@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  display: inline-block; width: 13px; height: 13px;
  border: 2px solid transparent; border-top-color: currentColor;
  border-radius: 50%; animation: spin 0.7s linear infinite;
}

/* ── TABS (inner) ── */
.tabs {
  display: flex; gap: 2px; padding: 3px;
  background: rgba(0,0,0,0.2);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-sm);
  margin-bottom: 16px; overflow-x: auto;
}
.tab {
  flex: 1; min-width: 56px; text-align: center;
  padding: 9px 10px;
  border-radius: var(--r-sm); border: none; background: transparent;
  color: var(--t3); cursor: pointer; white-space: nowrap;
  font-family: var(--f-ui); font-size: 12px; font-weight: 500;
  transition: all 0.2s;
}
.tab:hover { color: var(--t2); background: var(--glass-1); }
.tab.active { background: rgba(0,229,255,0.1); color: var(--cyan); }
.tab.admin-tab.active { background: var(--amber-gl); color: var(--amber); }

/* ── MODE OPTIONS ── */
.mode-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.mode-opt {
  flex: 1; min-width: 80px; text-align: center;
  padding: 12px 8px;
  background: var(--glass-1); border: 1px solid var(--glass-border);
  border-radius: var(--r-sm); cursor: pointer;
  font-family: var(--f-ui); font-size: 12px; color: var(--t2);
  transition: all 0.2s;
}
.mode-opt .mode-ico { font-size: 18px; display: block; margin-bottom: 4px; }
.mode-opt.active {
  background: var(--cyan-glo); border-color: rgba(0,229,255,0.3); color: var(--cyan);
  box-shadow: 0 0 16px rgba(0,229,255,0.08);
}

/* ── STATS ── */
.stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 14px; }
.stat {
  background: var(--glass-1); border: 1px solid var(--glass-border);
  border-radius: var(--r-sm); padding: 14px 8px; text-align: center;
  position: relative; overflow: hidden;
}
.stat::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: var(--statcolor, var(--cyan));
}
.stat-num { font-family: var(--f-hud); font-size: 22px; font-weight: 700; line-height: 1; margin-bottom: 4px; }
.stat-label { font-family: var(--f-code); font-size: 9px; color: var(--t3); letter-spacing: 1px; }
@media (max-width: 480px) { .stats-row { grid-template-columns: repeat(2,1fr); } .stat-num { font-size: 19px; } }

/* ── FILTERS ── */
.filter-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
.filter-pill {
  padding: 5px 12px; border-radius: 100px;
  font-family: var(--f-code); font-size: 10px;
  cursor: pointer; border: 1px solid var(--glass-border);
  background: transparent; color: var(--t3);
  transition: all 0.15s; letter-spacing: 1px;
}
.filter-pill.fa  { background: var(--cyan-gl);    border-color:rgba(0,229,255,0.3);   color:var(--cyan); }
.filter-pill.fd  { background: var(--green-gl);   border-color:rgba(0,230,118,0.3);   color:var(--green); }
.filter-pill.fp  { background: var(--amber-gl);   border-color:rgba(255,171,0,0.3);   color:var(--amber); }
.filter-pill.fn  { background: var(--red-gl);     border-color:rgba(255,23,68,0.3);   color:var(--red); }

/* ── MEMBER TAGS ── */
.member-tag {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--glass-1); border: 1px solid var(--glass-border);
  border-radius: 100px; padding: 4px 10px 4px 8px;
  font-family: var(--f-code); font-size: 11px; margin: 3px;
}
.member-tag .remove { cursor: pointer; color: var(--t3); transition: color 0.2s; }
.member-tag .remove:hover { color: var(--red); }
.members-wrap {
  display: flex; flex-wrap: wrap; padding: 8px;
  background: rgba(0,0,0,0.15); border: 1px solid var(--glass-border);
  border-radius: var(--r-sm); min-height: 50px; margin-bottom: 8px;
}

/* ── USER CARDS ── */
.user-card {
  background: var(--glass-1); border: 1px solid var(--glass-border);
  border-radius: var(--r-sm); padding: 10px 12px; margin-bottom: 6px;
  display: flex; align-items: center; gap: 10px;
  transition: all 0.2s; border-left: 2px solid transparent;
}
.user-card:hover { background: var(--glass-2); border-left-color: var(--cyan); }
.user-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--glass-2); border: 1px solid var(--glass-border);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0;
}
.user-info { flex: 1; min-width: 0; }
.user-name {
  font-size: 13px; font-weight: 600;
  direction: ltr; text-align: left; color: var(--t1);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.user-meta {
  font-family: var(--f-code); font-size: 10px; color: var(--t3);
  margin-top: 2px; direction: ltr; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
.user-badges { display: flex; gap: 4px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
.badge {
  font-family: var(--f-code); font-size: 9px; padding: 3px 8px;
  border-radius: 100px; border: 1px solid;
}
.badge-done    { border-color:rgba(0,230,118,0.35); color:var(--green);  background:var(--green-gl); }
.badge-like    { border-color:rgba(255,171,0,0.35);  color:var(--amber);  background:var(--amber-gl); }
.badge-none    { border-color:rgba(255,23,68,0.35);  color:var(--red);    background:var(--red-gl); }
.badge-partial { border-color:rgba(255,171,0,0.35);  color:var(--amber);  background:var(--amber-gl); }

/* ── PROGRESS ── */
.prog-wrap { height: 2px; background: var(--glass-border); border-radius: 2px; margin-top: 4px; overflow: hidden; }
.prog-bar { height: 100%; border-radius: 2px; transition: width 0.5s cubic-bezier(0.16,1,0.3,1); }

/* ── AI BOX ── */
.ai-box {
  background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border);
  border-left: 2px solid var(--cyan);
  border-radius: var(--r-sm); padding: 14px; margin-top: 10px;
  font-size: 13px; line-height: 2; color: var(--t1); white-space: pre-wrap;
}
.ai-box h4 { font-family: var(--f-code); font-size: 10px; letter-spacing: 2px; margin-bottom: 6px; color: var(--cyan); }

/* ── COMMENTS ── */
.comment-item {
  background: var(--glass-1); border: 1px solid var(--glass-border);
  border-radius: var(--r-sm); padding: 12px; margin-bottom: 8px;
  transition: border-color 0.2s;
}
.comment-item.selected { border-color: rgba(0,229,255,0.4); background: var(--cyan-glo); }
.comment-he { font-size: 14px; direction: rtl; text-align: right; line-height: 1.8; font-weight: 500; }
.comment-fa { font-family: var(--f-code); font-size: 11px; color: var(--t3); margin-top: 6px; border-top: 1px solid var(--glass-border); padding-top: 6px; line-height: 1.7; }
.comment-tone { font-family: var(--f-code); font-size: 9px; padding: 2px 8px; border: 1px solid; border-radius: 100px; display: inline-block; margin-top: 6px; }
.tone-pos { border-color: rgba(0,230,118,0.3); color: var(--green); }
.tone-neg { border-color: rgba(255,23,68,0.3); color: var(--red); }
.tone-neu { border-color: var(--glass-border); color: var(--t3); }
.comment-actions { display: flex; gap: 6px; margin-top: 8px; }
.mini-btn {
  font-family: var(--f-code); font-size: 10px; padding: 5px 10px;
  border: 1px solid var(--glass-border); background: transparent;
  color: var(--t3); cursor: pointer; border-radius: var(--r-sm);
  transition: all 0.15s;
}
.mini-btn:hover { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-glo); }
.mini-btn.sel { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-glo); }

/* ── PERSONA ── */
.persona-card {
  background: var(--glass-1); border: 1px solid var(--glass-border);
  border-radius: var(--r); padding: 18px; margin-top: 10px;
  border-top: 2px solid var(--amber);
}
.persona-sample-tag {
  font-family: var(--f-code); font-size: 9px; letter-spacing: 2px;
  color: var(--amber); border: 1px solid var(--amber-gl);
  padding: 3px 10px; border-radius: 100px; display: inline-block; margin-bottom: 12px;
}
.persona-field { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--glass-border); font-size: 12px; }
.persona-field .k { font-family: var(--f-code); color: var(--t3); min-width: 70px; font-size: 10px; }
.persona-field .v { color: var(--t1); flex: 1; }

/* ── ADMIN ── */
.pw-item {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  background: var(--glass-1); border: 1px solid var(--glass-border);
  border-radius: var(--r-sm); margin-bottom: 5px;
}
.pw-item .code { flex: 1; font-family: var(--f-code); font-size: 12px; color: var(--cyan); letter-spacing: 2px; }
.pw-item .role-tag { font-family: var(--f-code); font-size: 9px; padding: 2px 8px; border: 1px solid var(--glass-border); border-radius: 100px; color: var(--t3); }
.pw-item .del { cursor: pointer; color: var(--t4); font-size: 16px; transition: color 0.2s; }
.pw-item .del:hover { color: var(--red); }
.admin-report-item {
  background: var(--glass-1); border: 1px solid var(--glass-border);
  border-radius: var(--r-sm); padding: 12px; margin-bottom: 7px;
  border-left: 2px solid var(--glass-border);
}
.admin-report-head { display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.sec-badge { font-family: var(--f-code); font-size: 9px; padding: 2px 8px; border: 1px solid; border-radius: 100px; }
.sec-content { border-color: rgba(0,229,255,0.3); color: var(--cyan); }
.sec-monitor { border-color: rgba(213,0,249,0.3); color: var(--purple); }
.sec-persona { border-color: rgba(255,171,0,0.3); color: var(--amber); }
.sec-hr { border-color: rgba(0,230,118,0.3); color: var(--green); }

/* ── POST SECTIONS ── */
.post-section { background: var(--glass-1); border: 1px solid var(--glass-border); border-radius: var(--r-sm); margin-bottom: 8px; overflow: hidden; }
.post-header { padding: 10px 14px; background: rgba(0,0,0,0.15); border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; gap: 8px; cursor: pointer; transition: background 0.2s; }
.post-header:hover { background: rgba(0,0,0,0.2); }
.post-url-text { font-family: var(--f-code); font-size: 10px; color: var(--cyan); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; }
.post-body { padding: 12px 14px; }
.post-body.collapsed { display: none; }
.chevron { font-size: 10px; color: var(--t3); transition: transform 0.2s; }
.chevron.open { transform: rotate(180deg); }

/* ── MISC ── */
.limit-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.limit-row label { font-family: var(--f-code); font-size: 10px; color: var(--t3); white-space: nowrap; }
.limit-row select { flex: 1; }
.export-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.export-row .btn { flex: 1; }
.empty { text-align: center; padding: 28px 20px; font-family: var(--f-code); font-size: 11px; color: var(--t4); letter-spacing: 1px; }
.footer { text-align: center; padding: 20px 0 8px; font-family: var(--f-code); font-size: 9px; color: var(--t4); letter-spacing: 2px; }
.log { background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-left: 2px solid var(--green); border-radius: var(--r-sm); padding: 10px 14px; font-size: 10px; color: var(--t3); max-height: 150px; overflow-y: auto; direction: ltr; font-family: var(--f-code); line-height: 1.9; margin-bottom: 12px; display: none; }
.log.show { display: block; }
.log-ok { color: var(--green); } .log-err { color: var(--red); } .log-info { color: var(--cyan); } .log-gold { color: var(--amber); }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }

/* ── TOAST ── */
.toast-pop { position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%); background: var(--glass-2); border: 1px solid var(--glass-border); border-top: 1px solid var(--glass-border-hi); backdrop-filter: blur(12px); color: var(--t1); padding: 10px 20px; border-radius: 100px; font-family: var(--f-ui); font-size: 12px; z-index: 9999; white-space: nowrap; animation: toastIn 0.3s cubic-bezier(0.16,1,0.3,1); }
@keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(10px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
@media(min-width:768px){ .toast-pop { bottom: 24px; } }
</style>
</head>
<body>
<div class="ambient"></div>
<div class="ambient-grid"></div>
<div class="scanline"></div>

<!-- ── BOOT ── -->
<div id="boot">
  <div class="boot-logo-wrap">
    <div class="boot-crest">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 4L88 18V46C88 70 72 88 50 96C28 88 12 70 12 46V18Z" fill="rgba(0,229,255,0.04)" stroke="rgba(0,229,255,0.6)" stroke-width="1.5"/>
        <path d="M50 22L74 32V46C74 62 64 73 50 79C36 73 26 62 26 46V32Z" fill="none" stroke="rgba(0,229,255,0.2)" stroke-width="0.5"/>
        <path d="M50 32L53 42L63 42L55 49L58 59L50 52L42 59L45 49L37 42L47 42Z" fill="rgba(0,229,255,0.9)"/>
      </svg>
    </div>
    <div class="boot-title">ANDARZ<span>GOU</span></div>
    <div class="boot-sub">INTELLIGENCE SYSTEM · v7.0</div>
  </div>
  <div class="boot-terminal">
    <div class="boot-line-wrap" id="bootLines"></div>
    <div class="boot-progress-wrap"><div class="boot-progress" id="bootBar"></div></div>
    <div class="boot-pct" id="bootPct">0%</div>
  </div>
</div>

<!-- ── LOGIN ── -->
<div id="loginScreen">
  <div class="login-wrap">
    <div class="login-header">
      <div class="login-badge">SECURE ACCESS</div>
      <div class="login-org">مجموعه شهید اندرزگو</div>
      <div class="login-desc">INTEL SYS · CLASSIFIED · v7.0</div>
    </div>
    <div class="login-card">
      <div class="login-label">// ACCESS_CODE</div>
      <input type="password" class="login-input" id="loginInput" placeholder="────────────" autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="login-btn" onclick="doLogin()">AUTHENTICATE</button>
      <div class="login-err" id="loginErr"></div>
    </div>
    <div class="login-footer">
      <span style="width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 6px var(--green);"></span>
      ENCRYPTED · SECURE · AUTHORIZED ONLY
    </div>
  </div>
</div>

<!-- ── APP ── -->
<div class="app" id="app">
  <div class="app-layout" id="appLayout">

    <!-- TOP NAV -->
    <nav class="topnav">
      <div class="topnav-brand">
        <div class="topnav-crest">
          <svg viewBox="0 0 100 100" fill="none">
            <path d="M50 4L88 18V46C88 70 72 88 50 96C28 88 12 70 12 46V18Z" fill="rgba(255,171,0,0.06)" stroke="rgba(255,171,0,0.7)" stroke-width="2"/>
            <path d="M50 28L54 42L68 42L57 51L61 65L50 56L39 65L43 51L32 42L46 42Z" fill="var(--amber)"/>
          </svg>
        </div>
        <div>
          <div class="topnav-title">ANDARZGOU</div>
          <div class="topnav-version">INTEL v7.0</div>
        </div>
      </div>
      <div class="topnav-spacer"></div>
      <div class="topnav-clock" id="hudClock">--:--:--</div>
      <div class="topnav-user" id="userChip">
        <div class="topnav-dot"></div>
        <span class="topnav-user-name">LOADING</span>
      </div>
      <button class="topnav-logout" onclick="doLogout()">EXIT</button>
    </nav>

    <!-- SIDE NAV (desktop) -->
    <nav class="sidenav" id="sideNav"></nav>

    <!-- MAIN CONTENT -->
    <main class="app-main" id="appMain">
      <div class="content">
        <div class="panel" id="panel-content"></div>
        <div class="panel" id="panel-monitor"></div>
        <div class="panel" id="panel-persona"></div>
        <div class="panel" id="panel-hr"></div>
        <div class="panel" id="panel-admin"></div>
        <div class="panel" id="panel-setup"></div>
        <div class="log" id="logBox"></div>
        <div id="results"></div>
        <div class="footer">ANDARZGOU · INTEL SYS · CLASSIFIED · AUTHORIZED ACCESS ONLY</div>
      </div>
    </main>

  </div>

  <!-- BOTTOM TAB BAR (mobile) -->
  <nav class="tabbar" id="tabBar"></nav>
</div>

<script>
// ── Boot ──
const BOOT_LINES = [
  ['INIT', 'ANDARZGOU_INTEL v7.0'],
  ['LOAD', 'SECURITY_MODULES'],
  ['ESTAB','ENCRYPTED_CHANNEL'],
  ['VERIFY','SYSTEM_INTEGRITY'],
  ['LOAD', 'INTEL_DATABASE'],
  ['ACTIV','SURVEILLANCE_ENGINE'],
  ['ACTIV','GLASSMORPHISM_CORE'],
  ['OK',   'ALL_SYSTEMS_NOMINAL'],
];
(function boot(){
  const lines = document.getElementById('bootLines');
  const bar   = document.getElementById('bootBar');
  const pct   = document.getElementById('bootPct');
  let i = 0;
  function next(){
    if(i >= BOOT_LINES.length){
      setTimeout(()=>{
        document.getElementById('boot').classList.add('boot-hidden');
        const ls = document.getElementById('loginScreen');
        ls.style.display = 'flex';
      }, 500);
      return;
    }
    const [tag, msg] = BOOT_LINES[i];
    const div = document.createElement('div');
    div.className = 'boot-line';
    const tagColor = tag==='OK'?'var(--green)':tag==='ACTIV'?'var(--cyan)':'var(--t3)';
    div.innerHTML = `<span style="color:${tagColor};font-size:9px;letter-spacing:2px;">[${tag}]</span> <span style="color:var(--t2);">${msg}</span>`;
    lines.appendChild(div);
    const p = Math.round((i+1)/BOOT_LINES.length*100);
    bar.style.width = p+'%';
    pct.textContent = p+'%';
    i++;
    setTimeout(next, i===BOOT_LINES.length ? 400 : 140);
  }
  next();
})();

// ── Clock ──
setInterval(()=>{
  const el = document.getElementById('hudClock');
  if(el) el.textContent = new Date().toLocaleTimeString('en-US',{hour12:false});
}, 1000);
</script>

<script src="app.js"></script>
<script src="content.js"></script>
<script src="monitor.js"></script>
<script src="persona.js"></script>
<script src="hr.js"></script>
<script src="admin.js"></script>
<script>if(window.bootApp) bootApp();</script>
</body>
</html>
